name: ci 
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v4
        with:
          python-version: 3.x
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV 
      - uses: actions/cache@v3
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-
      - run: pip install mkdocs-material==9.7.6
      - run: pip install pymdown-extensions
      - run: pip3 install mkdocs-git-revision-date-localized-plugin
      - run: pip install mkdocs-htmlproofer-plugin
      - name: Check internal links (blocks deploy on failure)
        run: mkdocs build --strict
      - name: Check external links (informational only, does not block deploy)
        env:
          VALIDATE_EXTERNAL_URLS: "true"
        run: mkdocs build --strict || echo "::warning::External link check found issues (see log above) - not blocking deploy, since GitHub Actions' IP range is blocked by some government sites regardless of link validity"
      - name: Deploy
        run: mkdocs gh-deploy --force
