name: ci 
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v4
        with:
          python-version: 3.x
      - run: echo "cache_id=$(date --utc '+%V')" >> $GITHUB_ENV 
      - uses: actions/cache@v3
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-
      - run: pip install git+https://github.com/squidfunk/mkdocs-material
      - run: pip install pymdown-extensions
      - run: pip3 install mkdocs-git-revision-date-localized-plugin
      - run: pip install mkdocs-htmlproofer-plugin
      - name: Build and deploy (retry on transient link-check failures)
        env:
          VALIDATE_EXTERNAL_URLS: "true"
        run: |
          for attempt in 1 2 3; do
            mkdocs gh-deploy --force && break
            if [ "$attempt" -eq 3 ]; then
              echo "mkdocs gh-deploy failed after 3 attempts"
              exit 1
            fi
            echo "Attempt $attempt failed, retrying in 15s..."
            sleep 15
          done
